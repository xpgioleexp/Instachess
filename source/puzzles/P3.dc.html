<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzle 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 64px 72px; background: #0B0B0B; color: #F5F1E6; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 600; color: #B9B1A0">
<div>Puzzle 3, hard</div>
<div>6 / 8</div>
</div>
<h2 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 96px; line-height: 1; text-transform: uppercase; letter-spacing: 1px">Mate in two</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px">
<div aria-hidden="true" style="display: flex; flex-direction: column; width: 24px">
<sc-for list="{{ranks}}" as="r" hint-placeholder-count="8"><div style="height: 80px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; color: #B9B1A0">{{r}}</div></sc-for>
</div>
<div role="img" aria-label="Puzzle 3, White to play: White queen on c4 and knight on h6, Black king on h8 with a rook on f8 and pawns on g7 and h7" style="position: relative; width: 640px; height: 640px; display: grid; grid-template-columns: repeat(8, 80px)">
<sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
<div style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-family: 'DejaVu Sans', 'Segoe UI Symbol', 'Arial Unicode MS', sans-serif; font-size: 64px; line-height: 1; background: {{sq.bg}}; box-shadow: {{sq.ring}}; color: {{sq.fg}}; -webkit-text-stroke: {{sq.stroke}}; paint-order: stroke fill">{{sq.glyph}}</div>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="display: flex; margin-left: 34px">
<sc-for list="{{files}}" as="f" hint-placeholder-count="8"><div style="width: 80px; text-align: center; font-size: 20px; font-weight: 500; color: #B9B1A0">{{f}}</div></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 26px; font-weight: 600; color: #B9B1A0">White to play</div>
<p style="margin: 0; font-size: 34px; line-height: 1.35; color: #D8D1C2; max-width: 900px">Black's king is boxed into the corner. Hint: the winning first move gives away your queen.</p>
</div>
<div style="flex: 1"></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 600; color: #B9B1A0">
<div>@pawn.to.king.chess</div>
<svg aria-hidden="true" width="44" height="28" viewBox="0 0 44 28" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M2 14h38M28 3l12 11-12 11"></path></svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
squares(pos, hl) {
var g = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }, f = 'abcdefgh', out = [];
for (var r = 8; r >= 1; r--) {
for (var i = 0; i < 8; i++) {
var n = f[i] + r, dark = (i + r) % 2 === 1, pc = pos[n], glyph = '', fg = '#141414', stroke = '0px #141414';
if (pc) { glyph = g[pc.toLowerCase()] + '︎'; if (pc === pc.toUpperCase()) { fg = '#FFFFFF'; stroke = '2px #141414'; } }
out.push({ glyph: glyph, fg: fg, stroke: stroke, bg: dark ? '#9C7A45' : '#EADBB8', ring: hl.indexOf(n) >= 0 ? 'inset 0 0 0 6px #D4AF37' : 'none' });
}
}
return out;
}
renderVals() {
var p = { g1: 'K', c4: 'Q', h6: 'N', c1: 'B', a1: 'R', f1: 'R', a2: 'P', b2: 'P', c3: 'P', e4: 'P', f2: 'P', g2: 'P', h2: 'P', h8: 'k', d8: 'q', f8: 'r', a8: 'r', c8: 'b', a7: 'p', b7: 'p', c6: 'p', e5: 'p', g7: 'p', h7: 'p' };
return { squares: this.squares(p, []), ranks: ['8', '7', '6', '5', '4', '3', '2', '1'], files: ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'] };
}
}
</script>
</body>
</html>
