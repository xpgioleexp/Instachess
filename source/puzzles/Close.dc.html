<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzle Close</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 64px 72px; background: #0B0B0B; color: #F5F1E6; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 600; color: #B9B1A0">
<div>Puzzle Tuesday</div>
<div>8 / 8</div>
</div>
<div style="flex: 1"></div>
<h2 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 150px; line-height: 0.94; text-transform: uppercase; letter-spacing: 1px">How many<br>did you get?</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 8px">
<div style="border: 2px solid #3A342C; border-radius: 6px; padding: 24px 20px; display: flex; flex-direction: column; gap: 10px"><div style="font-family: Anton, sans-serif; font-size: 96px; line-height: 1">0</div><div style="font-size: 24px; line-height: 1.3; color: #B9B1A0">Save this and try again tomorrow</div></div>
<div style="border: 2px solid #3A342C; border-radius: 6px; padding: 24px 20px; display: flex; flex-direction: column; gap: 10px"><div style="font-family: Anton, sans-serif; font-size: 96px; line-height: 1">1</div><div style="font-size: 24px; line-height: 1.3; color: #B9B1A0">You see the basics</div></div>
<div style="border: 2px solid #3A342C; border-radius: 6px; padding: 24px 20px; display: flex; flex-direction: column; gap: 10px"><div style="font-family: Anton, sans-serif; font-size: 96px; line-height: 1">2</div><div style="font-size: 24px; line-height: 1.3; color: #B9B1A0">You spot forks</div></div>
<div style="border: 2px solid #D4AF37; border-radius: 6px; padding: 24px 20px; display: flex; flex-direction: column; gap: 10px"><div style="font-family: Anton, sans-serif; font-size: 96px; line-height: 1; color: #D4AF37">3</div><div style="font-size: 24px; line-height: 1.3; color: #B9B1A0">You found the sacrifice</div></div>
</div>
<p style="margin: 0; font-size: 36px; line-height: 1.35; color: #D8D1C2; max-width: 880px">Comment your number. Be honest.</p>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 20px; flex-wrap: wrap">
<div style="padding: 24px 40px; background: #D4AF37; color: #0B0B0B; font-size: 32px; font-weight: 700; border-radius: 6px">Save to retry later</div>
<div style="padding: 22px 38px; border: 2px solid #F5F1E6; font-size: 32px; font-weight: 600; border-radius: 6px">Send to a friend who plays</div>
</div>
<div style="font-size: 26px; font-weight: 600; color: #B9B1A0">New puzzles every Tuesday. Follow @pawn.to.king.chess</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
