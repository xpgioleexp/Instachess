<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answer 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 44px 92px 40px; background: #0B0B0B; color: #F5F1E6; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px">
<h2 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 86px; line-height: 1; letter-spacing: 1px">Ne7+ forks</h2>
<div style="font-size: 26px; font-weight: 600; color: #B9B1A0; white-space: nowrap">Answer 2</div>
</div>
<div role="img" aria-label="Answer: the knight jumps to e7, checking the king on g8 and attacking the queen on c6" style="position: relative; width: 896px; height: 896px; display: grid; grid-template-columns: repeat(8, 112px); flex-shrink: 0; border-radius: 4px; overflow: hidden">
<sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
<div style="position: relative; width: 112px; height: 112px; background: {{sq.bg}}; box-shadow: {{sq.ring}}">
<div aria-hidden="true" style="position: absolute; left: 7px; top: 4px; font-size: 19px; font-weight: 700; color: {{sq.co}}">{{sq.rank}}</div>
<div aria-hidden="true" style="position: absolute; right: 7px; bottom: 3px; font-size: 19px; font-weight: 700; color: {{sq.co}}">{{sq.file}}</div>
</div>
</sc-for>
<svg aria-hidden="true" width="896" height="896" viewBox="0 0 896 896" style="position: absolute; left: 0; top: 0; pointer-events: none"><g stroke="#141414" stroke-opacity="0.75" stroke-linecap="round" stroke-linejoin="round" fill="#141414" fill-opacity="0.75"><path d="{{a1.shaft}}" stroke-width="38" fill="none"></path><polygon points="{{a1.head}}" stroke-width="12"></polygon><path d="{{a2.shaft}}" stroke-width="38" fill="none"></path><polygon points="{{a2.head}}" stroke-width="12"></polygon></g><g stroke="#D4AF37" stroke-linecap="round" stroke-linejoin="round" fill="#D4AF37"><path d="{{a1.shaft}}" stroke-width="28" fill="none"></path><polygon points="{{a1.head}}" stroke-width="2"></polygon><path d="{{a2.shaft}}" stroke-width="28" fill="none"></path><polygon points="{{a2.head}}" stroke-width="2"></polygon></g></svg>
<div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 112px); pointer-events: none">
<sc-for list="{{squares}}" as="sq" hint-placeholder-count="64"><div style="position: relative; width: 112px; height: 112px"><sc-if value="{{sq.img}}"><img src="{{sq.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%"></sc-if></div></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 33px; line-height: 1.34; color: #D8D1C2; max-width: 896px"><b style="color: #F5F1E6">Two targets.</b> The knight checks the king and hits the queen. The king must move, then Nxc6.</p>
<p style="margin: 0; font-size: 28px; line-height: 1.34; color: #B9B1A0; max-width: 896px">Lesson: answer a threat with a bigger threat.</p>
</div>
<div style="flex: 1"></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 600; color: #B9B1A0">
<div>@pawn.to.king.chess</div>
<div style="display: flex; align-items: center; gap: 18px">5 / 8<svg aria-hidden="true" width="44" height="28" viewBox="0 0 44 28" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M2 14h38M28 3l12 11-12 11"></path></svg></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
squares(pos, hl, s) {
var f = 'abcdefgh', out = [];
for (var r = 8; r >= 1; r--) {
for (var i = 0; i < 8; i++) {
var n = f[i] + r, dark = (i + r) % 2 === 1, pc = pos[n], img = '';
if (pc) img = './pieces/' + (pc === pc.toUpperCase() ? 'w' : 'b') + pc.toUpperCase() + '.svg';
out.push({ img: img, bg: dark ? '#9C7A45' : '#EADBB8', co: dark ? '#EADBB8' : '#9C7A45', rank: i === 0 ? String(r) : '', file: r === 1 ? f[i] : '', ring: hl.indexOf(n) >= 0 ? 'inset 0 0 0 8px #D4AF37' : 'none' });
}
}
return out;
}
arrow(a, b, s) {
var f = 'abcdefgh', x1 = f.indexOf(a[0]) * s + s / 2, y1 = (8 - Number(a[1])) * s + s / 2, x2 = f.indexOf(b[0]) * s + s / 2, y2 = (8 - Number(b[1])) * s + s / 2;
var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
var tip = L - s * 0.26, base = tip - s * 0.5, w = s * 0.32;
var tx = x1 + ux * tip, ty = y1 + uy * tip, bx = x1 + ux * base, by = y1 + uy * base;
var pt = function (x, y) { return x.toFixed(1) + ',' + y.toFixed(1); };
return { shaft: 'M' + x1 + ' ' + y1 + 'L' + pt(bx + ux * 4, by + uy * 4).replace(',', ' '), head: pt(tx, ty) + ' ' + pt(bx - uy * w, by + ux * w) + ' ' + pt(bx + uy * w, by - ux * w) };
}
renderVals() {
var p = {"g1": "K", "e1": "R", "a2": "P", "b2": "P", "c2": "P", "f2": "P", "g2": "P", "h2": "P", "g8": "k", "c6": "q", "f8": "r", "c8": "b", "a7": "p", "b7": "p", "f7": "p", "g7": "p", "h7": "p", "e7": "N"};
return { squares: this.squares(p, ["e7"], 112), a1: this.arrow('e7', 'g8', 112), a2: this.arrow('e7', 'c6', 112) };
}
}
</script>
</body>
</html>
