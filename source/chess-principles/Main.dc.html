<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess Cover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 96px; background: #0B0B0B; color: #F5F1E6; font-family: Inter, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 700; letter-spacing: 6px">
<div style="color: {{accent}}">CHESS SERIES</div>
<div style="color: #9A9384">01 / 07</div>
</div>
<div style="display: flex; flex-direction: column; gap: 40px">
<div aria-hidden="true" style="font-family: 'DejaVu Sans', 'Segoe UI Symbol', 'Arial Unicode MS', sans-serif; font-size: 300px; line-height: 1; color: {{accent}}">{{knight}}</div>
<h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 140px; line-height: 0.92; text-transform: uppercase">Think like a<br><span style="color: {{accent}}">grandmaster</span></h1>
<p style="margin: 0; font-size: 44px; line-height: 1.3; color: #C9C2B2; max-width: 860px">5 principles that win games before move 10.</p>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 600; letter-spacing: 3px">
<div style="color: #9A9384">@pawn.to.king.chess</div>
<div style="display: flex; align-items: center; gap: 16px; color: {{accent}}">SWIPE<svg aria-hidden="true" width="44" height="28" viewBox="0 0 44 28" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M2 14h38M28 3l12 11-12 11"></path></svg></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4AF37","options":["#D4AF37","#E8E2D0","#C0392B","#2ECC71"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#D4AF37', knight: '♞︎' };
}
}
</script>
</body>
</html>
